name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Build, lint and prove the claims
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      # Runs against `next start`, not `next dev`: prefetching is disabled in
      # development and the static shell is only a static shell after a build.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
